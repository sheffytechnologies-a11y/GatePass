<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checkpass — Splash Screen Motion Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-green: #005E34;
      --brand-green-deep: #004D2A;
      --white: #FFFFFF;
      --ease-gravity: cubic-bezier(0.5, 0, 0.75, 0);
      --ease-bounce-up: cubic-bezier(0.2, 0.85, 0.25, 1);
      --ease-burst: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Container toolbar */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary {
      background: #00C97A;
      color: #00361C;
    }

    .btn-primary:hover {
      background: #10e08e;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-secondary.active {
      background: rgba(0, 201, 122, 0.2);
      border-color: #00C97A;
      color: #00C97A;
    }

    .speed-tag {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Phone Mockup Frame */
    .phone-stage {
      position: relative;
      width: 390px;
      height: 844px; /* iPhone 14 dimensions */
      max-width: 100vw;
      max-height: 92vh;
      border-radius: 48px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 12px #1e293b, 0 0 0 14px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island / Notch Mockup */
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* The Splash Screen Canvas */
    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ─── PHASE 1 & 2: THE BOUNCING DOT & EXPANDING CIRCLE ─── */
    .bouncing-dot-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* The green dot that moves */
    .motion-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: var(--brand-green);
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    /* Expanding flood circle that bursts from top position to fill screen */
    .screen-fill-circle {
      position: absolute;
      top: 14%; /* Matches the apex of the bounce */
      left: 50%;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-radius: 50%;
      background-color: var(--brand-green);
      z-index: 8;
      pointer-events: none;
      transform: scale(0.001);
      opacity: 0;
      will-change: transform, opacity;
    }

    /* ─── PHASE 3 & 4: LOGO & WORDMARK ─── */
    .brand-centerpiece {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      will-change: transform;
    }

    /* The Checkpass Icon Container */
    .icon-box {
      width: 54px;
      height: 54px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      will-change: transform;
    }

    .icon-box svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Quadrant paths for clockwise assembly */
    .quadrant {
      transform-origin: center;
      will-change: transform, opacity;
      opacity: 0;
    }

    /* Staggered Wordmark Container */
    .wordmark-container {
      display: flex;
      align-items: center;
      overflow: hidden; /* Clips letters until they slide out */
      margin-left: 10px;
      height: 54px;
      padding-right: 4px;
    }

    .wordmark-letter {
      font-size: 34px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.025em;
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity;
      transform: translate3d(-35px, 0, 0);
    }

    /* ─── PHASE 5: SHEFFY TECHNOLOGIES SUB-BRAND ─── */
    .footer-attribution {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translate3d(-50%, 15px, 0);
      opacity: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .footer-attribution svg {
      height: 22px;
      width: auto;
    }

    /* ─── ANIMATION CLASSES TRIGGERED VIA JS ─── */

    /* Dot Physics: Pure circle drops (slow start -> fast bottom), bounces to top, then smoothly zooms out filling screen */
    .animating .motion-dot {
      animation: dotBounceAndFill 1.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes dotBounceAndFill {
      0% {
        transform: translate3d(0, -20px, 0) scale(1);
        opacity: 1;
      }
      /* Starts slow */
      16% {
        transform: translate3d(0, 25px, 0) scale(1);
      }
      /* Accelerates down like gravity */
      34% {
        transform: translate3d(0, 160px, 0) scale(1);
      }
      /* Hits close to bottom - PERFECT CIRCLE, NO OVAL */
      48% {
        transform: translate3d(0, 310px, 0) scale(1);
      }
      /* Rebounds back up */
      62% {
        transform: translate3d(0, 120px, 0) scale(1);
      }
      75% {
        transform: translate3d(0, -120px, 0) scale(1);
      }
      /* Reaches top apex */
      84% {
        transform: translate3d(0, -280px, 0) scale(1);
      }
      /* Smoothly zooms out, filling the entire screen with green */
      90% {
        transform: translate3d(0, -280px, 0) scale(8);
      }
      96% {
        transform: translate3d(0, -280px, 0) scale(35);
      }
      100% {
        transform: translate3d(0, -280px, 0) scale(85);
        opacity: 1;
      }
    }

    /* Background permanent lock after flood completes */
    .animating.flood-active .splash-container {
      background-color: var(--brand-green);
    }

    /* Clockwise Quadrant Assembly (triggers after screen is fully filled with green) */
    /* 1: Top-Right */
    .animating .q-top-right {
      animation: assembleQuadrant 0.30s cubic-bezier(0.34, 1.4, 0.64, 1) 1.50s forwards;
    }
    /* 2: Bottom-Right */
    .animating .q-bottom-right {
      animation: assembleQuadrant 0.30s cubic-bezier(0.34, 1.4, 0.64, 1) 1.65s forwards;
    }
    /* 3: Bottom-Left */
    .animating .q-bottom-left {
      animation: assembleQuadrant 0.30s cubic-bezier(0.34, 1.4, 0.64, 1) 1.80s forwards;
    }
    /* 4: Top-Left */
    .animating .q-top-left {
      animation: assembleQuadrant 0.30s cubic-bezier(0.34, 1.4, 0.64, 1) 1.95s forwards;
    }

    @keyframes assembleQuadrant {
      0% {
        opacity: 0;
        transform: scale(0.65) translate3d(0, 0, 0);
      }
      70% {
        opacity: 1;
        transform: scale(1.06) translate3d(0, 0, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
      }
    }

    /* Icon Left-Glide & Size Reduction */
    .animating .icon-box {
      animation: glideIconLeft 0.65s cubic-bezier(0.22, 1, 0.36, 1) 2.05s forwards;
    }

    @keyframes glideIconLeft {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        /* Smoothly glides left while reducing size */
        transform: translate3d(-4px, 0, 0) scale(0.85);
      }
    }

    /* Wordmark Letters: Cascading slide-out from behind icon right edge */
    .animating .wordmark-letter {
      animation: revealLetter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes revealLetter {
      0% {
        opacity: 0;
        transform: translate3d(-35px, 0, 0) scale(0.9);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Sheffy Tech Logo Fade-in */
    .animating .footer-attribution {
      animation: revealFooter 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2.7s forwards;
    }

    @keyframes revealFooter {
      0% {
        opacity: 0;
        transform: translate3d(-50%, 15px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, 0, 0);
      }
    }

    /* Progress indicator at bottom */
    .step-pills {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      z-index: 100;
    }

    .pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    .pill.active {
      background: rgba(0, 201, 122, 0.2);
      color: #00c97a;
      border-color: rgba(0, 201, 122, 0.4);
      font-weight: 600;
    }
  </style>
</head>

  <!-- Realtime Timeline Phase Tracker -->
  <div class="step-pills">
    <div id="pill-1" class="pill active">1. Gravity Drop</div>
    <div id="pill-2" class="pill">2. Top Bounce</div>
    <div id="pill-3" class="pill">3. Screen Flood</div>
    <div id="pill-4" class="pill">4. Clockwise Assembly</div>
    <div id="pill-5" class="pill">5. Slide & Stagger</div>
  </div>

  <script>
    const stage = document.getElementById('splashStage');
    const btnReplay = document.getElementById('btnReplay');
    const btnSpeed = document.getElementById('btnSpeed');
    const btnProceed = document.getElementById('btnProceed');

    const pills = [
      document.getElementById('pill-1'),
      document.getElementById('pill-2'),
      document.getElementById('pill-3'),
      document.getElementById('pill-4'),
      document.getElementById('pill-5'),
    ];

    let isSlow = false;
    let timeouts = [];

    function clearAllTimeouts() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }

    function setPhase(index) {
      pills.forEach((p, i) => {
        if (i === index) p.classList.add('active');
        else p.classList.remove('active');
      });
    }

    function playAnimation() {
      clearAllTimeouts();
      stage.classList.remove('animating', 'flood-active');
      
      // Force DOM Reflow so animations restart cleanly
      void stage.offsetWidth;

      stage.classList.add('animating');
      setPhase(0);

      const mult = isSlow ? 2 : 1;

      // Phase 2: Top bounce
      timeouts.push(setTimeout(() => {
        setPhase(1);
      }, 550 * mult));

      // Phase 3: Flood screen
      timeouts.push(setTimeout(() => {
        stage.classList.add('flood-active');
        setPhase(2);
      }, 1000 * mult));

      // Phase 4: Clockwise assembly
      timeouts.push(setTimeout(() => {
        setPhase(3);
      }, 1250 * mult));

      // Phase 5: Icon glide & text stagger
      timeouts.push(setTimeout(() => {
        setPhase(4);
      }, 2050 * mult));
    }

    btnReplay.addEventListener('click', () => {
      playAnimation();
    });

    btnSpeed.addEventListener('click', () => {
      isSlow = !isSlow;
      if (isSlow) {
        document.documentElement.style.setProperty('--animation-rate', '2');
        btnSpeed.textContent = '0.5x Slow Motion';
        btnSpeed.classList.add('active');
        stage.style.animationDuration = '2x';
        document.querySelectorAll('*').forEach(el => {
          el.style.animationDuration = '';
        });
      } else {
        btnSpeed.textContent = '1.0x Normal';
        btnSpeed.classList.remove('active');
      }
      playAnimation();
    });

    btnProceed.addEventListener('click', () => {
      window.location.href = '/onboarding';
    });

    // Start on load
    window.addEventListener('DOMContentLoaded', () => {
      playAnimation();
    });
  </script>
</body>
</html>
