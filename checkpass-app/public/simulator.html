<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpass Mobile Phone Simulator & Device Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0A5C38;
      --primary-light: #E6F4EE;
      --accent: #00C97A;
      --studio-bg: #0B111E;
      --studio-panel: #161F30;
      --studio-border: rgba(255, 255, 255, 0.09);
      --phone-w: 393px;
      --phone-h: 852px;
      --phone-scale: 0.92;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--studio-bg);
      font-family: 'DM Sans', -apple-system, sans-serif;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── STUDIO HEADER BAR ─── */
    .studio-bar {
      height: 64px;
      background: var(--studio-panel);
      border-bottom: 1px solid var(--studio-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 22px;
      filter: brightness(0) invert(1);
    }

    .studio-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(0, 201, 122, 0.15);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0, 201, 122, 0.25);
    }

    /* Quick Route Shortcuts */
    .route-shortcuts {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--studio-border);
    }

    .route-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .route-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .route-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(10, 92, 56, 0.4);
    }

    /* Controls Group */
    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--studio-border);
      color: #F8FAFC;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .device-select option {
      background: var(--studio-panel);
      color: #FFF;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--studio-border);
      color: #CBD5E1;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    /* ─── STUDIO WORKSPACE CANVAS ─── */
    .studio-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 36px;
      position: relative;
      background:
        radial-gradient(circle at 50% 20%, rgba(10, 92, 56, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 201, 122, 0.08) 0%, transparent 50%),
        var(--studio-bg);
      overflow-y: auto;
    }

    /* Interactive URL Floating Breadcrumb */
    .url-pill-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(22, 31, 48, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--studio-border);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .url-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .url-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94A3B8;
      background: transparent;
      border: none;
      outline: none;
      width: 260px;
    }

    .url-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .url-act-btn {
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      transition: color 0.15s;
    }

    .url-act-btn:hover {
      color: #FFF;
    }

    /* ─── REALISTIC TITANIUM PHONE MOCKUP FRAME ─── */
    .mockup-wrapper {
      position: relative;
      transform: scale(var(--phone-scale));
      transform-origin: center top;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .phone-chassis {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 54px;
      background: #000000;
      /* Aerospace Titanium Bezel specular simulation */
      box-shadow:
        0 0 0 4px #2c3647,
        0 0 0 8px #19202c,
        0 0 0 12px #0f1520,
        0 30px 80px -15px rgba(0, 0, 0, 0.75),
        0 0 60px rgba(10, 92, 56, 0.25);
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    /* Physical Buttons silhouettes */
    .phone-chassis::before {
      /* Left volume & action buttons */
      content: '';
      position: absolute;
      top: 115px;
      left: -16px;
      width: 5px;
      height: 32px;
      background: #252e3d;
      border-radius: 3px 0 0 3px;
      box-shadow: 0 50px 0 #252e3d, 0 110px 0 #252e3d;
    }

    .phone-chassis::after {
      /* Right power button */
      content: '';
      position: absolute;
      top: 160px;
      right: -16px;
      width: 5px;
      height: 60px;
      background: #252e3d;
      border-radius: 0 3px 3px 0;
    }

    /* Phone Screen Container */
    .screen-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.4);
    }

    /* ─── REALISTIC STATUS BAR & DYNAMIC ISLAND ─── */
    .phone-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      pointer-events: none;
      font-size: 13.5px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .status-left {
      display: flex;
      align-items: center;
      margin-left: 6px;
    }

    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      cursor: pointer;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dynamic-island:hover {
      width: 134px;
    }

    .camera-lens {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #111827;
      border: 1px solid #1f2937;
      margin-left: auto;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 6px;
    }

    .battery-icon {
      width: 22px;
      height: 11px;
      border: 1.5px solid #FFFFFF;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }

    .battery-icon::after {
      content: '';
      position: absolute;
      top: 2px;
      right: -3px;
      width: 2px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 0 1px 1px 0;
    }

    .battery-level {
      height: 100%;
      width: 90%;
      background: #00C97A;
      border-radius: 1px;
    }

    /* ─── APPLICATION IFRAME ─── */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: #FFFFFF;
    }

    /* ─── HOME INDICATOR (SWIPE BAR) ─── */
    .home-indicator-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 136px;
      height: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      z-index: 50;
      pointer-events: none;
      transition: background 0.3s;
    }

    /* Theme adjustments depending on background */
    .theme-dark-status .phone-status-bar {
      color: #112019;
      text-shadow: none;
    }

    .theme-dark-status .battery-icon {
      border-color: #112019;
    }
    .theme-dark-status .battery-icon::after {
      background: #112019;
    }
    .theme-dark-status .home-indicator-bar {
      background: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- Top Studio Toolbar -->
  <header class="studio-bar">
    <div class="brand-wrap">
      <img src="/logo-dark.png" alt="Checkpass" class="brand-logo" />
      <span class="studio-tag">Phone Mockup Studio</span>
    </div>

    <!-- Quick Route Navigators (Chronological App Flow) -->
    <div class="route-shortcuts">
      <button class="route-btn active" onclick="loadRoute('/splash')">
        🎬 Splash Motion
      </button>
      <button class="route-btn" onclick="loadRoute('/onboarding')">
        🚀 Onboarding
      </button>
      <button class="route-btn" onclick="loadRoute('/login')">
        🔐 Login
      </button>
      <button class="route-btn" onclick="loadRoute('/pass-options.html')">
        🎫 Visitor Pass
      </button>
      <button class="route-btn" onclick="loadRoute('/tabs/home')">
        🏠 Dashboard
      </button>
    </div>

    <!-- Controls -->
    <div class="controls-group">
      <select class="device-select" id="deviceSelect" onchange="changeDevice(this.value)">
        <option value="iphone15pro">iPhone 15 Pro (393 × 852)</option>
        <option value="iphone14">iPhone 14 (390 × 844)</option>
        <option value="iphonese">iPhone SE (375 × 667)</option>
        <option value="pixel8">Google Pixel 8 (412 × 892)</option>
      </select>

      <button class="icon-btn" title="Refresh Screen" onclick="refreshFrame()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>

      <button class="icon-btn" title="Fit to Screen" onclick="toggleZoom()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- Interactive Workspace Canvas -->
  <main class="studio-workspace">

    <!-- Active Route Indicator -->
    <div class="url-pill-bar">
      <div class="url-status-dot"></div>
      <input type="text" id="urlInput" class="url-input" value="http://localhost:5173/splash" onkeydown="handleUrlKey(event)" />
      <div class="url-actions">
        <button class="url-act-btn" title="Go" onclick="loadCustomUrl()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- The Phone Mockup Frame -->
    <div class="mockup-wrapper" id="mockupWrapper">
      <div class="phone-chassis" id="phoneChassis">

        <div class="screen-viewport">

          <!-- Hardware Status Bar & Dynamic Island -->
          <div class="phone-status-bar" id="statusBar">
            <div class="status-left" id="liveClock">9:41</div>

            <div class="dynamic-island" id="dynamicIsland">
              <div class="camera-lens"></div>
            </div>

            <div class="status-right">
              <svg width="15" height="11" viewBox="0 0 16 12" fill="currentColor">
                <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
                <rect x="4" y="5.5" width="2.5" height="6.5" rx="0.5"/>
                <rect x="8" y="3" width="2.5" height="9" rx="0.5"/>
                <rect x="12" y="0" width="2.5" height="12" rx="0.5"/>
              </svg>
              <svg width="14" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
              <div class="battery-icon">
                <div class="battery-level"></div>
              </div>
            </div>
          </div>

          <!-- App iFrame (Starts with Splash Motion -> Transitions to Login) -->
          <iframe id="appFrame" class="app-frame" src="/splash"></iframe>

          <!-- iPhone Home Swipe Indicator -->
          <div class="home-indicator-bar" id="homeIndicator"></div>

        </div>

      </div>
    </div>

  </main>

  <script>
    const appFrame = document.getElementById('appFrame');
    const urlInput = document.getElementById('urlInput');
    const liveClock = document.getElementById('liveClock');
    const statusBar = document.getElementById('statusBar');
    const mockupWrapper = document.getElementById('mockupWrapper');
    const phoneChassis = document.getElementById('phoneChassis');

    const devices = {
      iphone15pro: { w: '393px', h: '852px', radius: '54px', island: true },
      iphone14:    { w: '390px', h: '844px', radius: '50px', island: true },
      iphonese:    { w: '375px', h: '667px', radius: '40px', island: false },
      pixel8:      { w: '412px', h: '892px', radius: '48px', island: false }
    };

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      liveClock.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadRoute(path) {
      if (path.includes('/tabs/')) {
        try {
          if (!localStorage.getItem('w_token')) {
            localStorage.setItem('w_token', 'demo_token_checkpass')
            localStorage.setItem('w_onboarded', 'true')
            localStorage.setItem('w_user_type', 'resident')
            localStorage.setItem('w_resident', JSON.stringify({
              id: 1,
              name: 'Dr. Chinedu Okafor',
              estateName: 'Emerald Greens Estate',
              flatAddress: 'House 4B, Emerald Street',
              phone: '+2348031234567'
            }))
            localStorage.setItem('w_user', JSON.stringify({
              id: 1,
              name: 'Dr. Chinedu Okafor',
              email: 'chinedu@checkpass.ng',
              role: 'resident'
            }))
          }
        } catch(e) {}
      }
      document.querySelectorAll('.route-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(path));
      });
      appFrame.src = path;
      urlInput.value = window.location.origin + path;
    }

    function refreshFrame() {
      appFrame.src = appFrame.src;
    }

    function handleUrlKey(e) {
      if (e.key === 'Enter') loadCustomUrl();
    }

    function loadCustomUrl() {
      let val = urlInput.value.trim();
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = '/' + val.replace(/^\/+/, '');
      }
      appFrame.src = val;
    }

    function changeDevice(devKey) {
      const dev = devices[devKey] || devices.iphone15pro;
      document.documentElement.style.setProperty('--phone-w', dev.w);
      document.documentElement.style.setProperty('--phone-h', dev.h);
      phoneChassis.style.borderRadius = dev.radius;
      document.getElementById('dynamicIsland').style.display = dev.island ? 'flex' : 'none';
    }

    let isScaled = true;
    function toggleZoom() {
      isScaled = !isScaled;
      document.documentElement.style.setProperty('--phone-scale', isScaled ? '0.92' : '1.0');
    }

    // Auto-sync iframe URL when navigating internally
    appFrame.addEventListener('load', () => {
      try {
        const frameLoc = appFrame.contentWindow.location.pathname;
        if (frameLoc) {
          urlInput.value = window.location.origin + frameLoc;
          document.querySelectorAll('.route-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('onclick').includes(frameLoc));
          });
        }
      } catch (e) {
        // cross-origin safeguard
      }
    });
  </script>

</body>
</html>
